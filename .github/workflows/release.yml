name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          VERSION_NUM=${VERSION#v}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="getnote.exe"
          else
            BINARY_NAME="getnote"
          fi
          go build -ldflags "-X github.com/iswalle/getnote-cli/internal/version.Version=${VERSION} -s -w" -o "${BINARY_NAME}" .

          # Create archive for GitHub release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "getnote-cli_${VERSION_NUM}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "${BINARY_NAME}"
          else
            tar -czf "getnote-cli_${VERSION_NUM}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "${BINARY_NAME}"
          fi


      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            getnote-cli_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            getnote-cli_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip


  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-main-package:
    name: Publish main package to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Update package version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$CURRENT" ]; then
            npm version $VERSION --no-git-tag-version
          fi

      - name: Build bundled platform binaries
        run: npm run prepare-package --silent

      - name: Publish main package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
